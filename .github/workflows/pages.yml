# Publishes web/ (the web flasher) to GitHub Pages, with the firmware parts from the latest release.
# The firmware is built on a maintainer's machine (docs/releasing.md) and attached to a release as helrig-box-web-firmware.zip: the page has to
# fetch it from its own origin, and release downloads do not send the headers a cross-origin fetch needs.
name: Publish web flasher

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the firmware from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern helrig-box-web-firmware.zip --dir "$RUNNER_TEMP"
          mkdir -p web/firmware
          unzip -o "$RUNNER_TEMP/helrig-box-web-firmware.zip" -d web/firmware
          test -f web/firmware/manifest.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
